services:
  db:
    image: mariadb:10.11
    command: --lower-case-table-names=1
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  web:
    build: { context: ., dockerfile: docker/Dockerfile }
    environment:
      DB_HOST: db
    ports:
      - "8080:80"
    depends_on: [db]
